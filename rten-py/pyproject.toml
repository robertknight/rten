[project]
name = "rten"
description = "Machine learning runtime"
requires-python = ">=3.12"
dependencies = ["numpy"]
readme = "README.md"
dynamic = ["version"]
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT.txt", "LICENSE-APACHE.txt"]

[dependency-groups]
dev = ["pytest", "onnx"]

[project.urls]
Homepage = "https://github.com/robertknight/rten"
Issues = "https://github.com/robertknight/rten/issues"

[build-system]
requires = ["maturin>=1.16,<2.0"]
build-backend = "maturin"

[tool.maturin]
# Default to an optimized build because debug builds are too slow for most uses.
profile = "release"
features = ["extension-module"]
module-name = "rten._rten"
python-source = "python"
