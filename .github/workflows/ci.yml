name: CI
on:
  pull_request:
  push:
    branches:
    - 'main'
    - 'ci/**'
jobs:
  ci:
    strategy:
      matrix:
        # The macOS build tests Arm and macOS-specific code paths.
        # The Linux build tests everything else (x64, wasm, Python ...)
        os: [ubuntu-latest, macos-14, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install and use MSRV Rust toolchain
      run: |
        rustup toolchain install 1.94.0 --component clippy,rustfmt
        rustup override set 1.94.0
    - name: Verify Rust version
      run: |
        rustc --version
        cargo --version
    - name: Install Rust WASM targets
      run: |
        rustup target add wasm32-unknown-unknown
        rustup target add wasm32-wasip1
      if: ${{ matrix.os == 'ubuntu-latest' }}
    - name: Install wasmtime
      run: |
        mkdir -p ~/.wasmtime
        curl -L https://github.com/bytecodealliance/wasmtime/releases/download/v29.0.1/wasmtime-v29.0.1-x86_64-linux.tar.xz | tar xf - --xz -C ~/.wasmtime --strip-components=1
        echo "$HOME/.wasmtime" >> "$GITHUB_PATH"
      if: ${{ matrix.os == 'ubuntu-latest' }}
    - name: Install Rust x86_64-apple-darwin target
      run: rustup target add x86_64-apple-darwin
      if: ${{ matrix.os == 'macos-14' }}
    - name: Cache
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/
          target/
        key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Install wasm-bindgen
      # nb. wasm-bindgen-cli version must match `wasm-bindgen` version in Cargo.lock
      run: cargo install wasm-bindgen-cli --version 0.2.105
      if: ${{ matrix.os == 'ubuntu-latest' }}
    - name: Build (no default features)
      run: cargo check --no-default-features
    - name: Build (default features)
      run: cargo build
    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
    - name: Test
      run: just test
    - name: Build (WASM)
      run: just wasm
      if: ${{ matrix.os == 'ubuntu-latest' }}
    - name: Test (WASM)
      run: |
        just wasm-test
        just wasm-test rten-simd
        just wasm-test rten-gemm
      if: ${{ matrix.os == 'ubuntu-latest' }}
    - name: Test (WASM relaxed-simd)
      run: |
        just relaxed=y wasm-test
        just relaxed=y wasm-test rten-simd
        just relaxed=y wasm-test rten-gemm
      if: ${{ matrix.os == 'ubuntu-latest' }}
    - name: Build (Intel macOS)
      run: cargo check --workspace --target x86_64-apple-darwin
      if: ${{ matrix.os == 'macos-14' }}
    - name: Lint
      run: |
        just checkformatting
        just lint
    - name: Docs
      run: |
        just docs
    - name: Docs (WASM)
      run: just wasm-docs
      if: ${{ matrix.os == 'ubuntu-latest' }}
    - name: Setup Python
      run: |
        python -m venv .venv
        .venv/bin/pip install --upgrade pip
      if: ${{ matrix.os == 'ubuntu-latest' }}
    - name: Python Lint
      run: |
        source .venv/bin/activate
        cd rten-convert
        pip install -e . -c constraints.txt
        pip install -r requirements.dev.txt -c constraints.txt
        make check
      if: ${{ matrix.os == 'ubuntu-latest' }}
